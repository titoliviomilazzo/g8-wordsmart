<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Word Smart Flashcards (G8)</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Word Smart</h1>
  <div id="who"></div>
</header>

<main id="login" class="panel">
  <h2>Select Student</h2>
  <div id="userList"></div>
  <form id="newUserForm">
    <input id="newName" placeholder="New Nickname" maxlength="20" required>
    <button>Add</button>
  </form>
  <p class="hint">All progress is automatically saved to this browser. Click 'Export' anytime to backup.</p>
</main>

<main id="home" class="panel hidden">
  <div class="stats" id="stats"></div>
  <h3>Today's Training</h3>
  <div class="row">
    <label>Chapter
      <select id="chSel"></select>
    </label>
    <label>Level
      <select id="lvSel">
        <option value="0">All Levels</option>
        <option value="1">Level 1 (Green)</option>
        <option value="2">Level 2 (Orange)</option>
        <option value="3">Level 3 (Red)</option>
      </select>
    </label>
    <label>New / Day <input type="number" id="newLimit" min="0" max="50" value="10"></label>
    <label style="flex-direction:row;align-items:center;cursor:pointer;padding-bottom:6px">
      <input type="checkbox" id="shuffleOpt" style="cursor:pointer"> Shuffle Order
    </label>
  </div>
  <div class="row">
    <button id="startStudy" class="big">Start Study (<span id="dueCount">0</span> cards)</button>
    <button id="startQuiz" class="big alt">4-Choice Quiz</button>
  </div>
  <h3>Progress Overview</h3>
  <div id="progress"></div>
  <div class="row">
    <button id="exportBtn">Export Data</button>
    <label class="filebtn">Import Data<input type="file" id="importFile" accept=".json" hidden></label>
    <button id="teacherBtn">Teacher Dashboard</button>
    <button id="switchUser">Switch Student</button>
  </div>
</main>

<main id="teacher" class="panel hidden">
  <div class="topbar"><button id="teacherBack">← Back to Home</button><h2>Teacher Progress Dashboard</h2></div>
  <p class="hint">Overview of all registered students' learning progress and retention stats on this device.</p>
  <div id="teacherTableWrap"></div>
</main>

<main id="study" class="panel hidden">
  <div class="topbar"><button id="quit">← Exit</button><span id="remain"></span></div>
  <div id="card" class="card">
    <div class="face front" id="front"></div>
    <div class="face back hidden" id="back"></div>
  </div>
  <div id="showWrap"><button id="showBtn" class="big">Show Answer (Space)</button></div>
  <div id="rateWrap" class="hidden">
    <button data-r="1" class="r1">Forgot (1)</button>
    <button data-r="2" class="r2">Hard (2)</button>
    <button data-r="3" class="r3">Good (3)</button>
  </div>
</main>

<main id="quiz" class="panel hidden">
  <div class="topbar"><button id="quizQuit">← Exit</button><span id="quizInfo"></span></div>
  <div id="quizQ" class="card"></div>
  <div id="quizOpts"></div>
</main>

<main id="done" class="panel hidden">
  <h2 id="doneTitle">Session Complete</h2>
  <p id="doneBody"></p>
  <button id="backHome" class="big">Back to Home</button>
</main>

<script src="cards.js"></script>
<script src="app.js"></script>
</body>
</html>
